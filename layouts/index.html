{{ define "main" }}
<div class="slider">
{{- range .Params.slides }}
<img src="{{ .image | strings.TrimPrefix "/" | relURL }}" alt="{{ .alt }}">
{{- end }}
</div>
<div class="mission">{{ .Content }}</div>
<div class="tiles">
{{- range .Params.tiles }}
<div><a href="{{ .url | strings.TrimPrefix "/" | relURL }}"><h2>{{ .title }}</h2><img loading="lazy" src="{{ .image | strings.TrimPrefix "/" | relURL }}" alt="{{ .title }}"></a>{{ with .credit }}<small class="credit">{{ . }}</small>{{ end }}</div>
{{- end }}
</div>
{{ end }}
